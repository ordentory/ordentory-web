<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ORDENTORY 회원가입</title><link rel="stylesheet" href="assets/css/main.css"><link rel="stylesheet" href="assets/css/account.css"></head><body class="account-body"><header class="account-header"><a class="account-brand" href="/"><img src="assets/images/brand/ordentory-logo.png" alt="ORDENTORY"></a><div class="account-header-actions"><a href="/">홈</a><a href="/login.html">로그인</a></div></header><main class="account-main account-auth-main"><p class="account-eyebrow">ORDENTORY ACCOUNT</p><h1 class="account-title">회원가입</h1><p class="account-lead">이메일을 로그인 ID로 사용합니다. 구매 이력이 있는 이메일이라면 기존 주문과 라이선스를 새 계정에 자동 연결합니다.</p><form id="signup-form" class="account-card"><div class="account-field"><label for="signup-email">이메일 *</label><div class="account-otp-row"><input id="signup-email" class="account-input" type="email" autocomplete="email" maxlength="254" required><button id="signup-send-otp" class="account-button secondary" type="button">인증번호 발송</button></div><p id="signup-otp-status" class="account-help">가입 전에 이메일 소유권을 확인합니다.</p></div><div class="account-field"><label for="signup-otp">이메일 인증번호 *</label><input id="signup-otp" class="account-input" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" disabled required></div><div class="account-field"><label for="signup-name">이름 *</label><input id="signup-name" class="account-input" autocomplete="name" maxlength="100" required></div><div class="account-field"><label for="signup-phone">휴대전화번호 *</label><input id="signup-phone" class="account-input" type="tel" autocomplete="tel" maxlength="30" required></div><div class="account-field"><label for="signup-business">사업체명 / 회사명 <span class="account-help">(선택)</span></label><input id="signup-business" class="account-input" maxlength="200"></div><div class="account-field"><label for="signup-password">비밀번호 *</label><input id="signup-password" class="account-input" type="password" autocomplete="new-password" minlength="8" maxlength="72" required><p class="account-help">8자 이상. 비밀번호는 서버에 평문으로 저장하지 않습니다.</p></div><div class="account-field"><label for="signup-password-confirm">비밀번호 확인 *</label><input id="signup-password-confirm" class="account-input" type="password" autocomplete="new-password" minlength="8" maxlength="72" required></div><label class="account-consent"><input id="signup-terms" type="checkbox" required><span><a href="/terms.html" target="_blank" rel="noopener">이용약관</a> 동의 (필수)</span></label><label class="account-consent"><input id="signup-privacy" type="checkbox" required><span><a href="/privacy.html" target="_blank" rel="noopener">개인정보 수집 및 이용</a> 동의 (필수)</span></label><label class="account-consent"><input id="signup-marketing-email" type="checkbox"><span>이메일 마케팅 정보 수신 동의 (선택)</span></label><label class="account-consent"><input id="signup-marketing-sms" type="checkbox"><span>SMS 마케팅 정보 수신 동의 (선택)</span></label><button id="signup-button" class="account-button" type="submit">회원가입</button><p id="auth-error" class="account-error" role="alert"></p><p class="account-switch">이미 가입하셨나요? <a href="/login.html">로그인</a></p></form><section id="signup-complete" class="account-card" hidden><p class="account-eyebrow">가입 완료</p><h2>ORDENTORY 계정이 만들어졌습니다.</h2><p class="account-lead">이제 My ORDENTORY에서 구매내역과 라이선스를 확인할 수 있습니다.</p><a class="account-button" style="display:block;text-align:center;text-decoration:none" href="/login.html">로그인하기</a></section></main><script src="assets/js/account-auth.js"></script></body></html>
