<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ORDENTORY 로그인</title><link rel="stylesheet" href="assets/css/main.css"><link rel="stylesheet" href="assets/css/account.css"></head><body class="account-body"><header class="account-header"><a class="account-brand" href="/"><img src="assets/images/brand/ordentory-logo.png" alt="ORDENTORY"></a><div class="account-header-actions"><a href="/">홈</a><a href="/signup.html">회원가입</a></div></header><main class="account-main account-auth-main"><p class="account-eyebrow">MY ORDENTORY</p><h1 class="account-title">로그인</h1><p class="account-lead">구매한 라이선스, 등록 PC, 구매내역과 고객지원을 한 곳에서 관리합니다.</p><form id="login-form" class="account-card"><div class="account-field"><label for="login-email">이메일</label><input id="login-email" class="account-input" type="email" autocomplete="username" maxlength="254" required></div><div class="account-field"><label for="login-password">비밀번호</label><input id="login-password" class="account-input" type="password" autocomplete="current-password" minlength="8" maxlength="72" required></div><button id="login-button" class="account-button" type="submit">로그인</button><p id="auth-error" class="account-error" role="alert"></p><p class="account-switch">아직 계정이 없나요? <a href="/signup.html">회원가입</a></p><p class="account-help">크몽 또는 자사몰에서 구매한 이메일로 가입하면 해당 구매정보와 라이선스가 같은 계정에 연결됩니다.</p></form></main><script src="assets/js/account-auth.js"></script></body></html>
