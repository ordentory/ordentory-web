<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>비밀번호 찾기 | ORDENTORY</title><link rel="stylesheet" href="assets/css/main.css"><link rel="stylesheet" href="assets/css/account.css"></head><body class="account-body"><header class="account-header"><a class="account-brand" href="/"><img src="assets/images/brand/ordentory-logo.png" alt="ORDENTORY"></a><div class="account-header-actions"><a href="/">홈</a><a href="/login.html">로그인</a></div></header><main class="account-main account-auth-main"><p class="account-eyebrow">MY ORDENTORY</p><h1 class="account-title">비밀번호 재설정</h1><p class="account-lead">가입 이메일로 인증번호를 확인한 뒤 새 비밀번호를 설정합니다.</p><div id="reset-area" class="account-card"><form id="reset-start"><div class="account-field"><label for="reset-email">가입 이메일</label><input id="reset-email" class="account-input" type="email" autocomplete="email" maxlength="254" required></div><button id="reset-start-button" class="account-button secondary" type="submit">인증번호 요청</button><p id="reset-status" class="account-help">계정 존재 여부는 화면에서 별도로 표시하지 않습니다.</p></form><form id="reset-complete" style="margin-top:22px"><div id="reset-step-2" hidden><div class="account-field"><label for="reset-otp">인증번호</label><input id="reset-otp" class="account-input" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></div><div class="account-field"><label for="reset-password">새 비밀번호</label><input id="reset-password" class="account-input" type="password" autocomplete="new-password" minlength="8" maxlength="72" required></div><div class="account-field"><label for="reset-password-confirm">새 비밀번호 확인</label><input id="reset-password-confirm" class="account-input" type="password" autocomplete="new-password" minlength="8" maxlength="72" required></div><button id="reset-complete-button" class="account-button" type="submit">비밀번호 변경</button></div></form><p id="auth-error" class="account-error" role="alert"></p></div><section id="reset-done" class="account-card" hidden><h2>비밀번호가 변경되었습니다.</h2><p class="account-lead">보안을 위해 기존 로그인 세션은 모두 종료되었습니다.</p><a class="account-button" style="display:block;text-align:center;text-decoration:none" href="/login.html">다시 로그인</a></section></main><script src="assets/js/account-auth.js"></script></body></html>
