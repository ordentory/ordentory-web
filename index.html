<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>ORDENTORY | 정식 오픈 준비 중</title>
  <style>
    :root{color-scheme:light}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    body{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:28px;
      background:#f7f9fc;
      color:#0e162a;
      font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,sans-serif
    }
    main{
      width:min(720px,100%);
      padding:56px 48px;
      border:1px solid #e2e8f0;
      border-radius:24px;
      background:#fff;
      box-shadow:0 24px 70px rgba(15,23,42,.07)
    }
    .brand{
      margin:0 0 26px;
      color:#125aef;
      font-size:14px;
      font-weight:900;
      letter-spacing:.12em
    }
    h1{
      margin:0;
      font-size:clamp(32px,6vw,52px);
      line-height:1.12;
      letter-spacing:-.045em
    }
    p{
      margin:24px 0 0;
      color:#526078;
      font-size:16px;
      line-height:1.8
    }
    .status{
      display:inline-flex;
      align-items:center;
      gap:8px;
      margin-top:30px;
      padding:10px 14px;
      border-radius:999px;
      background:#eef4ff;
      color:#125aef;
      font-size:13px;
      font-weight:800
    }
    .dot{width:8px;height:8px;border-radius:50%;background:#125aef}
    @media(max-width:560px){
      main{padding:38px 26px;border-radius:20px}
      p{font-size:15px}
    }
  </style>
</head>
<body>
  <main>
    <p class="brand">ORDENTORY</p>
    <h1>정식 오픈 준비 중입니다.</h1>
    <p>
      ORDENTORY Inventory의 판매 페이지와 운영 정책을 최종 점검하고 있습니다.
      정식 판매 및 무료체험은 준비가 완료된 뒤 이 페이지에서 안내하겠습니다.
    </p>
    <div class="status"><span class="dot"></span>Pre-launch preparation</div>
  </main>
</body>
</html>
