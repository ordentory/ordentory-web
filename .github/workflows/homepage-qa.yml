name: ORDENTORY Prelaunch + Toss Review QA

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-prelaunch-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public prelaunch home
        shell: bash
        run: |
          set -euo pipefail
          grep -q "정식 오픈 준비 중" index.html
          grep -q "복잡한 재고관리를" index.html
          grep -q "Windows용 재고관리 프로그램" index.html
          grep -q "assets/images/product/hero-home.webp" index.html
          grep -q 'name="robots" content="noindex,nofollow,noarchive"' index.html
          grep -q "286-34-01739" index.html
          grep -q "070-7594-2101" index.html
          grep -q 'href="/terms.html"' index.html
          grep -q 'href="/privacy.html"' index.html
          grep -q 'href="/refund.html"' index.html
          grep -q 'href="/checkout.html"' index.html
          grep -q '169,000원' index.html
          grep -q '199,000원' index.html
          grep -q '최대 2PC' index.html
          grep -q 'v1.x 무료 업데이트' index.html
          grep -q 'PG 심사 중' index.html
          ! grep -q 'href="trial.html"' index.html
          ! grep -q 'href="/trial.html"' index.html
          test -f assets/images/product/hero-home.webp
          test -f assets/images/brand/ordentory-logo.webp
          test "$(tr -d '\r\n' < CNAME)" = "ordentory.kr"
      - name: Verify Toss review checkout is accessible but noindex
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'name="robots" content="noindex,nofollow,noarchive"' checkout.html
          ! grep -q 'http-equiv="refresh"' checkout.html
          ! grep -q 'location.replace("/")' checkout.html
          grep -q 'https://js.tosspayments.com/v2/standard' checkout.html
          grep -q 'data-store-payments-enabled="false"' checkout.html
          grep -q 'disabled aria-disabled="true"' checkout.html
          grep -q 'PG 심사 진행 중' checkout.html
          grep -q 'STORE_PAYMENTS_ENABLED' assets/js/checkout.js
          grep -q 'REVIEW_DISABLED_MESSAGE' assets/js/checkout.js
          grep -q '169,000원' checkout.html
          grep -q '199,000원' checkout.html
          grep -q '영구 사용권' checkout.html
          grep -q '최대 2PC' checkout.html
          grep -q '286-34-01739' checkout.html
          grep -q '070-7594-2101' checkout.html
          grep -q '/terms.html' checkout.html
          grep -q '/privacy.html' checkout.html
          grep -q '/refund.html' checkout.html
      - name: Verify legal policies are review-accessible
        shell: bash
        run: |
          set -euo pipefail
          for f in terms.html privacy.html refund.html; do
            grep -q 'name="robots" content="noindex,nofollow,noarchive"' "$f"
            ! grep -q 'http-equiv="refresh"' "$f"
            ! grep -q 'location.replace("/")' "$f"
            grep -q "286-34-01739" "$f"
            grep -q "070-7594-2101" "$f"
          done
          grep -q "Toss Payments" privacy.html
          grep -q "v1.x" terms.html
          grep -q "v2.x" terms.html
          grep -q "결제일로부터 7일 이내" refund.html
          ! grep -q "통신판매업 신고" terms.html
          ! grep -q "통신판매업 신고" privacy.html
      - name: Verify payment result routes are available for test flow
        shell: bash
        run: |
          set -euo pipefail
          for f in payment-success.html payment-fail.html; do
            grep -q 'name="robots" content="noindex,nofollow,noarchive"' "$f"
            ! grep -q 'http-equiv="refresh"' "$f"
            ! grep -q 'location.replace("/")' "$f"
          done
          grep -q 'assets/js/payment-success.js' payment-success.html
          grep -q 'checkout.html' payment-fail.html
      - name: Verify public Trial remains hidden
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'name="robots" content="noindex,nofollow,noarchive"' trial.html
          grep -q 'http-equiv="refresh" content="0;url=/"' trial.html
          grep -q 'location.replace("/")' trial.html
      - name: Verify buyer manual remains available
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ORDENTORY INVENTORY v1.0.0' manual.html
          grep -q 'https://api.ordentory.kr/v1/store/installer' manual.html
          grep -q '1개 사업체 / 최대 2PC' manual.html
          grep -q 'name="robots" content="noindex,nofollow,noarchive"' manual.html
          ! grep -q 'http-equiv="refresh"' manual.html
      - name: Verify crawler block
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^User-agent: \*$' robots.txt
          grep -q '^Disallow: /$' robots.txt
