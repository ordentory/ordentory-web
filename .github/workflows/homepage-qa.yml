name: ORDENTORY Prelaunch Holding QA

on:
  push:
    branches:
      - main
      - ops/prelaunch-holding-20261005
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-holding-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public holding page
        shell: bash
        run: |
          set -euo pipefail
          grep -q "정식 오픈 준비 중입니다." index.html
          grep -q 'name="robots" content="noindex,nofollow,noarchive"' index.html
          ! grep -q "169,000원" index.html
          ! grep -q 'href="trial.html"' index.html
          ! grep -q 'href="checkout.html"' index.html
          test "$(tr -d '\r\n' < CNAME)" = "ordentory.kr"
      - name: Verify hidden storefront routes redirect home
        shell: bash
        run: |
          set -euo pipefail
          for f in checkout.html manual.html payment-fail.html payment-success.html preview.html privacy.html refund.html terms.html trial.html 404.html; do
            grep -q 'name="robots" content="noindex,nofollow,noarchive"' "$f"
            grep -q 'http-equiv="refresh" content="0;url=/"' "$f"
            grep -q 'location.replace("/")' "$f"
          done
      - name: Verify crawler block
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^User-agent: \*$' robots.txt
          grep -q '^Disallow: /$' robots.txt
