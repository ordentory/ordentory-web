name: ORDENTORY Homepage QA

on:
  push:
    branches:
      - prelaunch/storefront-development-20261005
      - feature/homepage-modular-v100-20261005
      - feature/trial-otp-email-20261005
      - feature/installer-manual-portal-20261005
  pull_request:
    branches:
      - prelaunch/storefront-development-20261005
      - main
      - feat/homepage-v1
      - feature/homepage-modular-v100-20261005
      - feature/trial-otp-email-20261005

permissions:
  contents: read

jobs:
  verify-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check modular v1.0.0 homepage and standalone preview
        run: node scripts/validate-homepage.mjs
      - name: Verify official manual portal and PDF approval gate
        run: node scripts/validate-manual-portal.mjs
      - name: Prepare browser QA
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Smoke test desktop, tablet and mobile layouts
        run: node scripts/smoke-homepage.cjs
      - name: Direct-store checkout workflow (mock API and Toss)
        run: node scripts/smoke-checkout.cjs
      - name: Trial application OTP workflow (mock API, no real emails)
        run: node scripts/smoke-trial.cjs
      - name: Save browser screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ordentory-homepage-browser-screenshots
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
