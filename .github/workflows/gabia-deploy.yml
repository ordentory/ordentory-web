name: Deploy ORDENTORY Web to Gabia

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gabia-deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GABIA_HOST: 211.47.74.75
      GABIA_USER: ordentoryweb
    steps:
      - uses: actions/checkout@v4

      - name: Verify deployable site files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f checkout.html
          test -f terms.html
          test -f privacy.html
          test -f refund.html
          test -f robots.txt
          test -d assets

      - name: Install SSH password helper
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Trust Gabia host key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 10 -H "$GABIA_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload static site with OpenSSH SCP
        shell: bash
        env:
          SSHPASS: ${{ secrets.GABIA_SFTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sshpass -e scp -r \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -- \
            *.html robots.txt assets \
            "$GABIA_USER@$GABIA_HOST:www_root/"

      - name: Verify remote site files
        shell: bash
        env:
          SSHPASS: ${{ secrets.GABIA_SFTP_PASSWORD }}
        run: |
          set -euo pipefail
          sshpass -e ssh \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            "$GABIA_USER@$GABIA_HOST" \
            'set -e; cd www_root; test -f index.html; test -f checkout.html; test -f terms.html; test -f privacy.html; test -f refund.html; test -f robots.txt; test -d assets; echo GABIA_DEPLOY_OK'
