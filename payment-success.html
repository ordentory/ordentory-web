<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ORDENTORY | 결제 승인 확인</title><style>body{font-family:Arial,"Noto Sans KR",sans-serif;max-width:650px;margin:60px auto;padding:0 20px;line-height:1.7}#message{white-space:pre-wrap}</style><script src="/qa-config.js"></script></head><body>
<h1>결제 승인 확인</h1><p id="message" role="status" aria-live="polite">서버에서 결제 승인 및 라이선스 발급 결과를 확인하고 있습니다. 창을 닫지 마세요.</p><p><a href="/checkout.html">결제 페이지</a></p>
<script>
"use strict";
(async()=>{
 const message=document.getElementById("message"),query=new URLSearchParams(location.search);
 const API=String(window.ORDENTORY_QA_API_ORIGIN||"").replace(/\/$/,"");
 const paymentKey=query.get("paymentKey"),orderId=query.get("orderId"),amountText=query.get("amount"),amount=Number(amountText);
 // Remove provider tokens from browser history after parsing.
 history.replaceState(null,"",location.pathname);
 if(!paymentKey||!orderId||!amountText||!Number.isSafeInteger(amount)||amount<=0){
  message.textContent="결제 승인 정보가 누락되었거나 올바르지 않습니다. 고객지원에 문의해 주세요.";return;
 }
 if(!/^https:\/\//.test(API)||new URL(API).hostname==="api.ordentory.kr"){message.textContent="격리된 QA Backend가 설정되지 않아 승인 요청을 차단했습니다. 주문번호 "+orderId+"를 기록해 두세요.";return;}
 try{
  const response=await fetch(API+"/v1/store/payments/confirm",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({paymentKey,orderId,amount})});
  if(!response.ok){
   message.textContent="결제 결과를 자동으로 확정하지 못했습니다. 동일 주문으로 새로 결제하지 마시고, 고객지원(support@ordentory.kr)에 주문번호 "+orderId+"를 알려 주세요. (확인 코드 HTTP "+response.status+")";
   return;
  }
  const result=await response.json();
  if(result.orderId!==orderId||result.amount!==amount){message.textContent="결제 확인 응답이 일치하지 않습니다. 고객지원에 주문번호 "+orderId+"를 알려 주세요.";return;}
  message.textContent="결제 승인이 완료되었습니다. 주문번호: "+orderId+"\n라이선스 발급 결과를 확인했습니다. 구매자 이메일 인증과 설치 안내는 별도 연결 검증 후 공개됩니다.";
 }catch(_){message.textContent="네트워크 오류로 결제 결과를 확인하지 못했습니다. 재결제하지 마시고 support@ordentory.kr에 주문번호 "+orderId+"를 알려 주세요.";}
})();
</script></body></html>
