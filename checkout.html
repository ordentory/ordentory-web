<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ORDENTORY | 결제 테스트</title><meta name="robots" content="noindex,nofollow">
<style>body{font-family:Arial,"Noto Sans KR",sans-serif;max-width:720px;margin:48px auto;padding:0 20px;color:#172033}input,button{font:inherit;padding:12px}input{width:100%;box-sizing:border-box;margin:10px 0}button{background:#172033;color:#fff;border:0;border-radius:7px;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}#status{white-space:pre-wrap}small{color:#586273}</style>
<script src="https://js.tosspayments.com/v2/standard"></script></head>
<body><h1>ORDENTORY Inventory</h1><p>결제 화면 QA — 운영 공개 전용 아님</p>
<form id="checkout-form"><label for="email">구매자 이메일</label><input id="email" type="email" maxlength="254" autocomplete="email" required placeholder="example@email.com"><button id="create" type="submit">결제 주문 준비</button></form>
<p id="status" role="status" aria-live="polite">먼저 구매자 이메일을 입력해 주세요.</p>
<section id="payment" hidden><p id="summary"></p><div id="payment-method"></div><div id="agreement"></div><button id="pay" type="button" disabled>결제 진행</button></section>
<script>
"use strict";
const API="https://api.ordentory.kr";
const form=document.getElementById("checkout-form"),create=document.getElementById("create"),pay=document.getElementById("pay"),status=document.getElementById("status");
let checkout=null,widgets=null;
form.addEventListener("submit",async event=>{
 event.preventDefault();create.disabled=true;pay.disabled=true;
 status.textContent="서버에서 결제금액과 주문번호를 확인하고 있습니다.";
 try{
  const response=await fetch(API+"/v1/store/checkouts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({buyerEmail:document.getElementById("email").value.trim()})});
  if(!response.ok)throw new Error(response.status===503?"현재 자사몰 결제 기능이 비활성화되어 있습니다.":"주문을 생성하지 못했습니다. ("+response.status+")");
  checkout=await response.json();
  if(!checkout.orderId||!checkout.clientKey||!Number.isSafeInteger(checkout.amount)||checkout.amount<=0)throw new Error("결제 주문 응답이 올바르지 않습니다.");
  if(!checkout.clientKey.startsWith("test_"))throw new Error("QA 화면에서는 토스 테스트 클라이언트 키만 허용됩니다.");
  const origin=new URL(checkout.successUrl).origin;
  if(origin!==location.origin||new URL(checkout.failUrl).origin!==location.origin)throw new Error("결제 결과 URL의 도메인이 현재 QA 도메인과 다릅니다.");
  // QA page is deliberately blocked until a dedicated backend's StoreOrigin matches the QA host.
  const toss=TossPayments(checkout.clientKey);
  widgets=toss.widgets({customerKey:checkout.customerKey||"ANONYMOUS"});
  await widgets.setAmount({currency:"KRW",value:checkout.amount});
  document.getElementById("summary").textContent="주문번호 "+checkout.orderId+" / 결제금액 "+checkout.amount.toLocaleString("ko-KR")+"원";
  document.getElementById("payment").hidden=false;
  await Promise.all([widgets.renderPaymentMethods({selector:"#payment-method",variantKey:"DEFAULT"}),widgets.renderAgreement({selector:"#agreement",variantKey:"AGREEMENT"})]);
  pay.disabled=false;status.textContent="결제수단과 약관을 확인해 주세요.";
 }catch(e){document.getElementById("payment").hidden=true;status.textContent=e.message||"결제 준비에 실패했습니다.";}finally{create.disabled=false;}
});
pay.addEventListener("click",async()=>{
 if(!widgets||!checkout)return;
 pay.disabled=true;status.textContent="토스 결제 인증 화면으로 이동합니다.";
 try{await widgets.requestPayment({orderId:checkout.orderId,orderName:checkout.orderName||"ORDENTORY Inventory",successUrl:checkout.successUrl,failUrl:checkout.failUrl,customerEmail:checkout.buyerEmail});}
 catch(e){status.textContent=e.message||"결제가 중단되었습니다.";pay.disabled=false;}
});
</script></body></html>
